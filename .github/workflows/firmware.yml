name: Firmware

# Builds on every change. A push to main (or a manual run) creates a release with a
# fixed file name -> the M5Launcher always downloads the latest version:
#   https://github.com/GhostBeacon/takt/releases/latest/download/takt.bin

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FW_VERSION: 1.0.${{ github.run_number }}

jobs:
  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only for the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run

      - name: Name the file
        run: |
          mkdir -p out
          cp .pio/build/cardputer-adv/firmware.bin out/takt.bin
          sha256sum out/takt.bin | tee out/takt.bin.sha256
          echo "Size: $(stat -c %s out/takt.bin) Bytes" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: takt-${{ env.FW_VERSION }}
          path: out/*
          if-no-files-found: error

      - name: Create release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$FW_VERSION" out/takt.bin out/takt.bin.sha256 \
            --title "Takt $FW_VERSION" \
            --notes "Built from ${GITHUB_SHA::7}. For the M5Stack Cardputer ADV, install it with the M5Launcher." \
            --target "$GITHUB_SHA" \
            --latest
