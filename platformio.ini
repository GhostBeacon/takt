; Takt - drum machine for the M5Stack Cardputer ADV (ESP32-S3FN8, 8 MB flash, no PSRAM)
; Build:   pio run            -> .pio/build/cardputer-adv/firmware.bin
; Install: M5Launcher -> OTA/Favorite (releases/latest/download/takt.bin) or SD -> Install
; No Wi-Fi in the firmware: keep it small so several apps fit into the launcher.

[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; the GitHub workflow sets the version (FW_VERSION), local builds stay "dev"
    !echo "-DFW_VERSION=\\\"${FW_VERSION:-dev}\\\""
lib_deps =
    m5stack/M5Cardputer@^1.1.1
